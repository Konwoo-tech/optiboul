name: Récit utilisateur
description: Nouveau récit pour le backlog produit
title: 'US-xxx · '
labels: ['type:récit']
body:
  - type: textarea
    id: recit
    attributes:
      label: Récit
      placeholder: En tant que …, je veux … afin de …
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      placeholder: '- [ ] …'
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Référence (CdC §, R, O)
  - type: dropdown
    id: priorite
    attributes:
      label: Priorité (MoSCoW)
      options: [Must, Should, Could]
