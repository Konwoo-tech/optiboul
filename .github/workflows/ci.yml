name: CI

# Ne teste que les parties touchées : API ou application web (spécification technique §11).
on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main', 'develop']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changements:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filtre.outputs.api }}
      web: ${{ steps.filtre.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filtre
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
              - 'apps/api/schema.yml'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: 'apps/api/.python-version'
      - uses: pre-commit/action@v3.0.1

  api:
    needs: changements
    if: needs.changements.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      COMPOSE: docker compose -f docker-compose.local.yml
    steps:
      - uses: actions/checkout@v6

      - name: Fichiers d'environnement locaux (exemples sans secret)
        run: |
          for f in .envs/.local/.django .envs/.local/.postgres; do cp "$f.example" "$f"; done

      - name: Construction de l'image Django
        run: $COMPOSE build django

      - name: Migrations à jour
        run: $COMPOSE run --rm django python manage.py makemigrations --check

      - name: Tests (pytest)
        run: $COMPOSE run --rm django pytest

      - name: Règle de dépendance (import-linter)
        run: $COMPOSE run --rm django lint-imports

      - name: Contrat API (schema.yml à jour)
        run: |
          $COMPOSE run --rm django python manage.py spectacular --file schema.yml --validate
          git diff --exit-code schema.yml || { echo "::error::apps/api/schema.yml n'est pas à jour : lancer make api-client"; exit 1; }

      - name: Arrêt
        if: always()
        run: $COMPOSE down

  web:
    needs: changements
    if: needs.changements.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: 'apps/web/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'apps/web/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile

      - name: Contrat API (client généré à jour)
        run: |
          pnpm api-client
          git diff --exit-code src/api/generated || { echo "::error::apps/web/src/api/generated n'est pas à jour : lancer make api-client"; exit 1; }

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
