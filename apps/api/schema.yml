      description: |-
        * `matieres` - Matières premières
        * `salaires` - Salaires
        * `electricite` - Électricité
        * `eau` - Eau
        * `administration` - Administration
        * `technique` - Technique
        * `petit_materiel` - Petit matériel
        * `lait` - Lait supplément salaire
        * `extra` - Extra
    ChangementGroupe:
