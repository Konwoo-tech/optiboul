openapi: 3.0.3
info:
  title: OptiBoul API
  version: 1.0.0
  description: API REST d'OptiBoul ERP (Boulangerie du Faubourg)
paths:
  /api/v1/brouillons/:
    get:
      operationId: brouillons_list
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brouillon'
          description: ''
  /api/v1/brouillons/{cle}/:
    get:
      operationId: brouillons_retrieve
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
        '404':
          description: No response body
    put:
      operationId: brouillons_update
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brouillon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Brouillon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Brouillon'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
    delete:
      operationId: brouillons_destroy
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/caisses/:
    get:
      operationId: caisses_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaisseList'
          description: ''
  /api/v1/caisses/{id}/:
    get:
      operationId: caisses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
  /api/v1/caisses/{id}/especes/:
    get:
      operationId: caisses_especes_retrieve
      description: Fonds, espèces encaissées, dépenses, remises et attendu de la caisse.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especes'
          description: ''
  /api/v1/caisses/{id}/fermer/:
    post:
      operationId: caisses_fermer_create
      description: Un seul comptage ; statut juste, manque ou excédent ; sauvegarde
        (US-042).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fermeture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fermeture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Fermeture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatFermeture'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/{id}/rouvrir/:
    post:
      operationId: caisses_rouvrir_create
      description: Gérant ou propriétaire, motif obligatoire ; le propriétaire est
        informé.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reouverture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reouverture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reouverture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/ouvrir/:
    post:
      operationId: caisses_ouvrir_create
      description: Ouverture en comptant le fonds ; hors planning, le gérant est prévenu.
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ouverture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ouverture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ouverture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/prochaine/:
    get:
      operationId: caisses_prochaine_retrieve
      description: Créneau à ouvrir, caissière planifiée et fonds proposé (20 000
        FCFA).
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prochaine'
          description: ''
  /api/v1/connexion/annuler/:
    post:
      operationId: connexion_annuler_create
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/connexion/changer-utilisateur/:
    post:
      operationId: connexion_changer_utilisateur_create
      description: '« Changer d''utilisateur » : la session se ferme ; poste et brouillons
        restent.'
      tags:
      - connexion
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/connexion/code/:
    post:
      operationId: connexion_code_create
      description: Nom + code à 4 chiffres, vérifié dès le 4ᵉ chiffre (US-010).
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatConnexion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/deconnexion/:
    post:
      operationId: connexion_deconnexion_create
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/connexion/email/:
    post:
      operationId: connexion_email_create
      description: 'E-mail + mot de passe : double authentification à chaque connexion.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatConnexion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/invitation/:
    post:
      operationId: connexion_invitation_create
      description: 'Lien de l''invitation (US-020) : la personne choisit son mot de
        passe.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invitation'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/otp/envoyer/:
    post:
      operationId: connexion_otp_envoyer_create
      description: Code à 6 chiffres par SMS ou WhatsApp (renvoi après 30 s, bascule
        de canal).
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeEnvoye'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/otp/verifier/:
    post:
      operationId: connexion_otp_verifier_create
      description: Code reçu, vérifié dès le 6ᵉ chiffre ; 3 essais puis nouveau code.
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verification'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/session/:
    get:
      operationId: connexion_session_retrieve
      description: Méthode de connexion et délai d'inactivité, pour le minuteur de
        l'écran.
      tags:
      - connexion
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/connexion/totp/:
    post:
      operationId: connexion_totp_create
      description: 'Sans réseau : code de l''application d''authentification ou code
        de secours.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verification'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/utilisateurs/:
    get:
      operationId: connexion_utilisateurs_list
      description: Les noms à toucher sur le poste de confiance du comptoir (O1).
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonneDuPoste'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/groupes/:
    get:
      operationId: groupes_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - groupes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupeList'
          description: ''
    post:
      operationId: groupes_create
      tags:
      - groupes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Groupe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Groupe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Groupe'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groupe'
          description: ''
  /api/v1/groupes/{id}/:
    patch:
      operationId: groupes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) groupe.
        required: true
      tags:
      - groupes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroupe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGroupe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGroupe'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groupe'
          description: ''
  /api/v1/journal/:
    get:
      operationId: journal_list
      description: 'Journal non modifiable : aucune route d''écriture, la base refuse
        UPDATE.'
      parameters:
      - in: query
        name: au
        schema:
          type: string
          format: date
        description: Dernier jour inclus
      - in: query
        name: auteur
        schema:
          type: integer
        description: Identifiant de l'acteur
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - in: query
        name: du
        schema:
          type: string
          format: date
        description: Premier jour inclus
      - in: query
        name: type
        schema:
          type: string
        description: Type d'objet (caisse…) ou préfixe d'action (connexion…)
      tags:
      - journal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLigneJournalList'
          description: ''
  /api/v1/mfa/:
    get:
      operationId: mfa_list
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EtatMfa'
          description: ''
  /api/v1/mfa/codes-secours/:
    post:
      operationId: mfa_codes_secours_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodesSecours'
          description: ''
  /api/v1/mfa/totp/activer/:
    post:
      operationId: mfa_totp_activer_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeTotp'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CodeTotp'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodeTotp'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodesSecours'
          description: ''
        '400':
          description: No response body
  /api/v1/mfa/totp/desactiver/:
    post:
      operationId: mfa_totp_desactiver_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/mfa/totp/preparer/:
    post:
      operationId: mfa_totp_preparer_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTotp'
          description: ''
  /api/v1/parametres/:
    get:
      operationId: parametres_list
      tags:
      - parametres
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parametre'
          description: ''
  /api/v1/parametres/{cle}/:
    put:
      operationId: parametres_update
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - parametres
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Modification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Modification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Modification'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parametre'
          description: ''
  /api/v1/parametres/{cle}/historique/:
    get:
      operationId: parametres_historique_list
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - parametres
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Valeur'
          description: ''
  /api/v1/postes/:
    get:
      operationId: postes_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - postes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosteList'
          description: ''
    post:
      operationId: postes_create
      description: Enregistre ce navigateur comme poste de confiance (cookie signé).
      tags:
      - postes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Poste'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Poste'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Poste'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poste'
          description: ''
  /api/v1/postes/{id}/revoquer/:
    post:
      operationId: postes_revoquer_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) poste de
          confiance.
        required: true
      tags:
      - postes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poste'
          description: ''
  /api/v1/postes/actuel/:
    get:
      operationId: postes_actuel_retrieve
      description: Ce navigateur est-il un poste de confiance ? (écran de connexion,
        O1).
      tags:
      - postes
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosteActuel'
          description: ''
  /api/v1/sante/:
    get:
      operationId: sante
      description: État du service, utilisé par les contrôles de santé et le bandeau
        hors ligne.
      tags:
      - sante
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
          description: ''
  /api/v1/sauvegardes/:
    get:
      operationId: sauvegardes_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - sauvegardes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
