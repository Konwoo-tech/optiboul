openapi: 3.0.3
info:
  title: OptiBoul API
  version: 1.0.0
  description: API REST d'OptiBoul ERP (Boulangerie du Faubourg)
paths:
  /api/v1/accueil/:
    get:
      operationId: accueil_retrieve
      description: L'écran d'arrivée du profil et son contenu (O10).
      tags:
      - accueil
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accueil'
          description: ''
  /api/v1/alertes/:
    get:
      operationId: alertes_list
      description: Alertes du CdC §5.11, les bloquantes d'abord ; chacune ouvre son
        détail.
      tags:
      - alertes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alerte'
          description: ''
  /api/v1/brouillons/:
    get:
      operationId: brouillons_list
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brouillon'
          description: ''
  /api/v1/brouillons/{cle}/:
    get:
      operationId: brouillons_retrieve
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
        '404':
          description: No response body
    put:
      operationId: brouillons_update
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brouillon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Brouillon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Brouillon'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
    delete:
      operationId: brouillons_destroy
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/budgets/:
    get:
      operationId: budgets_list
      description: La direction suit le budget ; le propriétaire le fixe.
      parameters:
      - in: query
        name: mois
        schema:
          type: string
        description: AAAA-MM ; ce mois-ci
      tags:
      - budgets
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budgets/fixer/:
    put:
      operationId: budgets_fixer_update
      description: La direction suit le budget ; le propriétaire le fixe.
      tags:
      - budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixerBudget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FixerBudget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FixerBudget'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/caisses/:
    get:
      operationId: caisses_list
      description: Historique par jour et par caissière, la plus récente d'abord.
      parameters:
      - in: query
        name: au
        schema:
          type: string
        description: AAAA-MM-JJ
      - in: query
        name: caissiere
        schema:
          type: integer
      - in: query
        name: du
        schema:
          type: string
        description: AAAA-MM-JJ
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: statut
        schema:
          type: string
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaisseList'
          description: ''
  /api/v1/caisses/{id}/:
    get:
      operationId: caisses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
  /api/v1/caisses/{id}/especes/:
    get:
      operationId: caisses_especes_retrieve
      description: Fonds, espèces encaissées, dépenses, remises et attendu de la caisse.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especes'
          description: ''
  /api/v1/caisses/{id}/fermer/:
    post:
      operationId: caisses_fermer_create
      description: Un seul comptage ; statut juste, manque ou excédent ; sauvegarde
        (US-042).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fermeture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fermeture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Fermeture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatFermeture'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/{id}/remettre/:
    post:
      operationId: caisses_remettre_create
      description: Remise au coffre ou au gérant (O4) ; receveur et heure tracés.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Clé unique de l'opération, générée par l'application web.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Remise'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Remise'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Remise'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especes'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/{id}/rouvrir/:
    post:
      operationId: caisses_rouvrir_create
      description: Gérant ou propriétaire, motif obligatoire ; le propriétaire est
        informé.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reouverture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reouverture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reouverture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/ouvrir/:
    post:
      operationId: caisses_ouvrir_create
      description: Ouverture en comptant le fonds ; hors planning, le gérant est prévenu.
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ouverture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ouverture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ouverture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/prochaine/:
    get:
      operationId: caisses_prochaine_retrieve
      description: Créneau à ouvrir, caissière planifiée et fonds proposé (20 000
        FCFA).
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prochaine'
          description: ''
  /api/v1/caisses/recapitulatif/:
    get:
      operationId: caisses_recapitulatif_list
      description: 'Par caissière : ouvertures, recette et écart cumulé (CdC §5.2).'
      parameters:
      - in: query
        name: au
        schema:
          type: string
        description: AAAA-MM-JJ
      - in: query
        name: caissiere
        schema:
          type: integer
      - in: query
        name: du
        schema:
          type: string
        description: AAAA-MM-JJ
      - in: query
        name: statut
        schema:
          type: string
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recapitulatif'
          description: ''
  /api/v1/clients/:
    get:
      operationId: clients_list
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: query
        name: actif
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: recherche
        schema:
          type: string
        description: Premières lettres du nom
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: clients_create
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEcriture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientEcriture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientEcriture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/clients/{id}/:
    get:
      operationId: clients_retrieve
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    put:
      operationId: clients_update
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEcriture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientEcriture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientEcriture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
    patch:
      operationId: clients_partial_update
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientEcriture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientEcriture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientEcriture'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/clients/{id}/envoyer-releve/:
    post:
      operationId: clients_envoyer_releve_create
      description: Le relevé part par WhatsApp, par la file d'envoi (O15).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Periode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Periode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Periode'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/clients/{id}/relancer/:
    post:
      operationId: clients_relancer_create
      description: Relance WhatsApp de la dette du client, par la file d'envoi (O15).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatRelance'
          description: ''
  /api/v1/clients/{id}/relances/:
    get:
      operationId: clients_relances_list
      description: Relances du client, la plus récente d'abord, avec l'état de l'envoi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRelanceList'
          description: ''
  /api/v1/clients/{id}/releve/:
    get:
      operationId: clients_releve_retrieve
      description: Historique du compte avec le solde courant ; 30 jours par défaut
        (US-064).
      parameters:
      - in: query
        name: au
        schema:
          type: string
      - in: query
        name: du
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Releve'
          description: ''
  /api/v1/clients/{id}/releve-pdf/:
    get:
      operationId: clients_releve_pdf_retrieve
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: query
        name: au
        schema:
          type: string
      - in: query
        name: du
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/clients/{id}/tarifs/:
    put:
      operationId: clients_tarifs_update
      description: 'Tarif par produit : un prix fixe le tarif propre, null le retire.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tarifs'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tarifs'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tarifs'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/clients/dettes/:
    get:
      operationId: clients_dettes_retrieve
      description: Clients qui doivent de l'argent, la plus grosse dette d'abord (R21).
      parameters:
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - a_jour
          - dette
          - plafond_depasse
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dettes'
          description: ''
  /api/v1/clients/importer/:
    post:
      operationId: clients_importer_create
      description: 'Reprise du classeur (US-150) : simuler, relire le rapport, confirmer.'
      tags:
      - clients
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportClasseur'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapportImport'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/clients/relancer-groupe/:
    post:
      operationId: clients_relancer_groupe_create
      description: 'Relance groupée : chaque client qui doit et a un numéro reçoit
        un message.'
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelanceGroupee'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RelanceGroupee'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RelanceGroupee'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatRelance'
          description: ''
  /api/v1/commandes/:
    get:
      operationId: commandes_list
      description: Commandes d'une session ; la caisse et le gérant les saisissent.
      parameters:
      - in: query
        name: creneau
        schema:
          type: string
          enum:
          - jour
          - nuit
      - in: query
        name: jour
        schema:
          type: string
        description: AAAA-MM-JJ, avec le créneau
      tags:
      - commandes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commande'
          description: ''
    post:
      operationId: commandes_create
      description: Saisit la commande du client ; une seconde saisie remplace ses
        lignes.
      tags:
      - commandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Saisie'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Saisie'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Saisie'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
          description: ''
        '201':
          content:
            application/json:
              schema:
