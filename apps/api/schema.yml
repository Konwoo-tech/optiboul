components:
  schemas:
    Acces:
      type: object
      properties:
        profil:
          type: string
        espaces:
          type: array
          items:
            type: string
        accueil:
          type: string
          nullable: true
        fonctions:
          type: array
          items:
            type: string
      required:
      - accueil
      - espaces
      - fonctions
      - profil
    Affectations:
      type: object
      properties:
        gerant:
          type: integer
          nullable: true
        production:
          type: integer
          nullable: true
      required:
      - gerant
      - production
    Apercu:
      type: object
      properties:
        groupe:
          type: integer
      required:
      - groupe
    Brouillon:
      type: object
      properties:
        cle:
          type: string
          readOnly: true
          title: Écran
        contenu: {}
        mis_a_jour:
          type: string
          format: date-time
          readOnly: true
          title: Mis à jour le
      required:
      - cle
      - contenu
      - mis_a_jour
    Caisse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        semaine:
          type: integer
        jour:
          type: string
          format: date
          readOnly: true
        creneau:
          type: string
          readOnly: true
          title: Créneau
        caissiere:
          $ref: '#/components/schemas/Caissiere'
        planifiee:
          allOf:
          - $ref: '#/components/schemas/Caissiere'
          nullable: true
        hors_planning:
          type: boolean
          readOnly: true
        fonds:
          type: integer
          readOnly: true
          title: Fonds (FCFA)
        attendu:
          type: integer
          readOnly: true
          nullable: true
          title: Attendu (FCFA)
        compte:
          type: integer
          readOnly: true
          nullable: true
          title: Compté (FCFA)
        ecart:
          type: integer
          readOnly: true
          nullable: true
          title: Écart (FCFA)
        statut:
          type: string
          readOnly: true
        en_cours:
          type: boolean
          readOnly: true
        ouverte_le:
          type: string
          format: date-time
          readOnly: true
        fermee_le:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fermée le
      required:
      - attendu
      - caissiere
      - compte
      - creneau
      - ecart
      - en_cours
      - fermee_le
      - fonds
      - hors_planning
      - id
      - jour
      - ouverte_le
      - planifiee
      - semaine
      - statut
    Caissiere:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
      required:
      - id
      - nom
    CanalEnum:
      enum:
      - sms
      - whatsapp
      type: string
      description: |-
        * `sms` - sms
        * `whatsapp` - whatsapp
    ChangementGroupe:
      type: object
      properties:
        groupe:
          type: integer
      required:
      - groupe
    Code:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{4}$
      required:
      - code
    CodeEnvoye:
      type: object
      properties:
        heure:
          type: string
        canal:
          type: string
        telephoneMasque:
          type: string
        renvoiDans:
          type: integer
      required:
      - canal
      - heure
      - renvoiDans
      - telephoneMasque
    CodeTotp:
      type: object
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
    CodesSecours:
      type: object
      properties:
        codesSecours:
          type: array
          items:
            type: string
      required:
      - codesSecours
    Compte:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Name of User
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse électronique
        groupe:
          type: integer
          nullable: true
          readOnly: true
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        bloque:
          type: boolean
          readOnly: true
        bloque_jusqua:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Bloqué jusqu'à
      required:
      - bloque
      - bloque_jusqua
      - email
      - groupe
      - id
      - is_active
      - name
      - profil
    CompteCree:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Name of User
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse électronique
        groupe:
          type: integer
          nullable: true
          readOnly: true
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        bloque:
          type: boolean
          readOnly: true
        bloque_jusqua:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Bloqué jusqu'à
        codesSecours:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - bloque
      - bloque_jusqua
      - codesSecours
      - email
      - groupe
      - id
      - is_active
      - name
      - profil
    ConflitPlanning:
      type: object
      properties:
        genre:
          $ref: '#/components/schemas/GenreEnum'
        jour:
          type: string
          format: date
        caissiere:
          type: integer
      required:
      - caissiere
      - genre
      - jour
    ConnexionCode:
      type: object
      properties:
        utilisateur:
          type: integer
        code:
          type: string
          maxLength: 4
          minLength: 4
      required:
      - code
      - utilisateur
    ConnexionEmail:
      type: object
      properties:
        email:
          type: string
          format: email
        motDePasse:
          type: string
      required:
      - email
      - motDePasse
    Creneau:
      type: object
      properties:
        jour:
          type: string
          format: date
        creneau:
          $ref: '#/components/schemas/CreneauEnum'
        caissiere:
          allOf:
          - $ref: '#/components/schemas/Personne'
          nullable: true
      required:
      - caissiere
      - creneau
      - jour
    CreneauEnum:
      enum:
      - jour
      - nuit
      type: string
      description: |-
        * `jour` - jour
        * `nuit` - nuit
    EnvoiCode:
      type: object
      properties:
        canal:
          $ref: '#/components/schemas/CanalEnum'
      required:
      - canal
    Especes:
      type: object
      properties:
        fonds:
          type: integer
        especes:
          type: integer
        depenses:
          type: integer
        remises:
          type: integer
        attendu:
          type: integer
      required:
      - attendu
      - depenses
      - especes
      - fonds
      - remises
    EtatMfa:
      type: object
      properties:
        totp:
          type: boolean
        codesSecoursRestants:
          type: integer
      required:
      - codesSecoursRestants
      - totp
    EtatSauvegardes:
      type: object
      properties:
        derniere_locale:
          type: string
          format: date-time
          nullable: true
        derniere_cloud:
          type: string
          format: date-time
          nullable: true
        cloud_en_retard:
          type: boolean
        seuil_alerte_heures:
          type: integer
      required:
      - cloud_en_retard
      - derniere_cloud
      - derniere_locale
      - seuil_alerte_heures
    Fermeture:
      type: object
      properties:
        compte:
          type: integer
          minimum: 0
      required:
      - compte
    GenreEnum:
      enum:
      - jour_et_nuit
      - nuit_puis_jour
      type: string
      description: |-
        * `jour_et_nuit` - jour_et_nuit
        * `nuit_puis_jour` - nuit_puis_jour
    Groupe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 150
        profil:
          $ref: '#/components/schemas/ProfilEnum'
        description:
          type: string
          default: ''
        membres:
          type: integer
          readOnly: true
      required:
      - id
      - membres
      - nom
      - profil
    Invitation:
      type: object
      properties:
        uid:
          type: string
        jeton:
          type: string
        motDePasse:
          type: string
      required:
      - jeton
      - motDePasse
      - uid
    LigneJournal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        horodatage:
