openapi: 3.0.3
info:
  title: OptiBoul API
  version: 1.0.0
  description: API REST d'OptiBoul ERP (Boulangerie du Faubourg)
paths:
  /api/v1/journal/:
    get:
      operationId: journal_list
      description: 'Journal non modifiable : aucune route d''écriture, la base refuse
        UPDATE.'
      parameters:
      - in: query
        name: au
        schema:
          type: string
          format: date
        description: Dernier jour inclus
      - in: query
        name: auteur
        schema:
          type: integer
        description: Identifiant de l'acteur
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - in: query
        name: du
        schema:
          type: string
          format: date
        description: Premier jour inclus
      - in: query
        name: type
        schema:
          type: string
        description: Type d'objet (caisse…) ou préfixe d'action (connexion…)
      tags:
      - journal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLigneJournalList'
          description: ''
  /api/v1/parametres/:
    get:
      operationId: parametres_list
      tags:
      - parametres
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parametre'
          description: ''
  /api/v1/parametres/{cle}/:
    put:
      operationId: parametres_update
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - parametres
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Modification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Modification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Modification'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parametre'
          description: ''
  /api/v1/parametres/{cle}/historique/:
    get:
      operationId: parametres_historique_list
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - parametres
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Valeur'
          description: ''
  /api/v1/sante/:
    get:
      operationId: sante
      description: État du service, utilisé par les contrôles de santé et le bandeau
        hors ligne.
      tags:
      - sante
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
          description: ''
  /api/v1/users/:
    get:
      operationId: users_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    LigneJournal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        horodatage:
          type: string
          format: date-time
          readOnly: true
        acteur:
          type: integer
          readOnly: true
          nullable: true
        acteur_nom:
          type: string
          readOnly: true
          title: Nom de l'acteur
        profil:
          type: string
          readOnly: true
        poste_id:
          type: integer
          readOnly: true
          nullable: true
          title: Poste
        poste_nom:
          type: string
          readOnly: true
          title: Nom du poste
        entree:
          type: string
          readOnly: true
          title: Entrée
        action:
          type: string
          readOnly: true
        objet_type:
          type: string
          readOnly: true
          title: Type d'objet
        objet_id:
          type: string
          readOnly: true
          title: Identifiant de l'objet
        avant:
          readOnly: true
          nullable: true
          title: Valeurs avant
        apres:
          readOnly: true
          nullable: true
          title: Valeurs après
      required:
      - acteur
      - acteur_nom
      - action
      - apres
      - avant
      - entree
      - horodatage
      - id
      - objet_id
      - objet_type
      - poste_id
      - poste_nom
      - profil
    Modification:
      type: object
      properties:
        valeur: {}
      required:
      - valeur
    NullEnum:
      enum:
      - null
    PaginatedLigneJournalList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/LigneJournal'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    Parametre:
      type: object
      properties:
        cle:
          type: string
        libelle:
          type: string
        genre:
          type: string
        unite:
          type: string
        usage:
          type: string
        valeur: {}
        defaut: {}
        choix:
          type: array
          items:
            type: integer
        minimum:
          type: integer
          nullable: true
        maximum:
          type: integer
          nullable: true
        modifie_le:
          type: string
          format: date-time
          nullable: true
        modifie_par:
          type: string
      required:
      - choix
      - cle
      - defaut
      - genre
      - libelle
      - maximum
      - minimum
      - modifie_le
      - modifie_par
      - unite
      - usage
      - valeur
    PatchedUser:
      type: object
      properties:
        name:
          type: string
          title: Name of User
          maxLength: 255
        url:
          type: string
          format: uri
          readOnly: true
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
    ProfilEnum:
      enum:
      - caissier
      - gerant
      - production
      - proprietaire
      - administrateur
      type: string
      description: |-
        * `caissier` - Caissier / caissière
        * `gerant` - Gérant de la semaine
        * `production` - Responsable de production
        * `proprietaire` - Propriétaire
        * `administrateur` - Administrateur
    Sante:
      type: object
      properties:
        statut:
          type: string
        base:
          type: boolean
      required:
      - base
      - statut
    User:
      type: object
      properties:
        name:
          type: string
          title: Name of User
          maxLength: 255
        url:
          type: string
          format: uri
          readOnly: true
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - profil
      - url
    Valeur:
      type: object
      properties:
        valeur: {}
        auteur:
          type: string
        le:
          type: string
          format: date-time
      required:
      - auteur
      - le
      - valeur
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
