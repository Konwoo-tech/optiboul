        type:
          $ref: '#/components/schemas/TypeEnum'
        telephone:
          type: string
          title: Téléphone
          maxLength: 20
        lieu:
          type: string
          maxLength: 150
        plafond:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Plafond propre (FCFA)
        plafond_effectif:
          type: integer
          readOnly: true
        solde:
          type: integer
          description: 'Somme des mouvements du compte, en FCFA ; négatif : dette
