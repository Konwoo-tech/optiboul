openapi: 3.0.3
info:
  title: OptiBoul API
  version: 1.0.0
  description: API REST d'OptiBoul ERP (Boulangerie du Faubourg)
paths:
  /api/v1/brouillons/:
    get:
      operationId: brouillons_list
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brouillon'
          description: ''
  /api/v1/brouillons/{cle}/:
    get:
      operationId: brouillons_retrieve
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
        '404':
          description: No response body
    put:
      operationId: brouillons_update
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brouillon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Brouillon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Brouillon'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
    delete:
      operationId: brouillons_destroy
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/connexion/annuler/:
    post:
      operationId: connexion_annuler_create
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/connexion/changer-utilisateur/:
    post:
      operationId: connexion_changer_utilisateur_create
      description: '« Changer d''utilisateur » : la session se ferme ; poste et brouillons
        restent.'
      tags:
      - connexion
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/connexion/code/:
    post:
      operationId: connexion_code_create
      description: Nom + code à 4 chiffres, vérifié dès le 4ᵉ chiffre (US-010).
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatConnexion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/deconnexion/:
    post:
      operationId: connexion_deconnexion_create
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/connexion/email/:
    post:
      operationId: connexion_email_create
      description: 'E-mail + mot de passe : double authentification à chaque connexion.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatConnexion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/otp/envoyer/:
    post:
      operationId: connexion_otp_envoyer_create
      description: Code à 6 chiffres par SMS ou WhatsApp (renvoi après 30 s, bascule
        de canal).
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeEnvoye'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/otp/verifier/:
    post:
      operationId: connexion_otp_verifier_create
      description: Code reçu, vérifié dès le 6ᵉ chiffre ; 3 essais puis nouveau code.
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verification'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/session/:
    get:
      operationId: connexion_session_retrieve
      description: Méthode de connexion et délai d'inactivité, pour le minuteur de
        l'écran.
      tags:
      - connexion
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/connexion/totp/:
    post:
      operationId: connexion_totp_create
      description: 'Sans réseau : code de l''application d''authentification ou code
        de secours.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verification'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/utilisateurs/:
    get:
      operationId: connexion_utilisateurs_list
      description: Les noms à toucher sur le poste de confiance du comptoir (O1).
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonneDuPoste'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/journal/:
    get:
      operationId: journal_list
      description: 'Journal non modifiable : aucune route d''écriture, la base refuse
        UPDATE.'
      parameters:
      - in: query
        name: au
        schema:
          type: string
          format: date
        description: Dernier jour inclus
      - in: query
        name: auteur
        schema:
          type: integer
        description: Identifiant de l'acteur
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      - in: query
        name: du
        schema:
          type: string
          format: date
        description: Premier jour inclus
      - in: query
        name: type
        schema:
          type: string
        description: Type d'objet (caisse…) ou préfixe d'action (connexion…)
      tags:
      - journal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLigneJournalList'
          description: ''
  /api/v1/mfa/:
    get:
      operationId: mfa_list
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EtatMfa'
          description: ''
  /api/v1/mfa/codes-secours/:
    post:
      operationId: mfa_codes_secours_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodesSecours'
          description: ''
  /api/v1/mfa/totp/activer/:
    post:
      operationId: mfa_totp_activer_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeTotp'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CodeTotp'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodeTotp'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodesSecours'
          description: ''
        '400':
          description: No response body
  /api/v1/mfa/totp/desactiver/:
    post:
      operationId: mfa_totp_desactiver_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/mfa/totp/preparer/:
    post:
      operationId: mfa_totp_preparer_create
      description: 'US-012 : TOTP compatible Google Authenticator, 10 codes de secours.'
      tags:
      - mfa
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTotp'
          description: ''
  /api/v1/parametres/:
    get:
      operationId: parametres_list
      tags:
      - parametres
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parametre'
          description: ''
  /api/v1/parametres/{cle}/:
    put:
      operationId: parametres_update
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - parametres
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Modification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Modification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Modification'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parametre'
          description: ''
  /api/v1/parametres/{cle}/historique/:
    get:
      operationId: parametres_historique_list
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - parametres
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Valeur'
          description: ''
  /api/v1/postes/:
    get:
      operationId: postes_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - postes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosteList'
          description: ''
    post:
      operationId: postes_create
      description: Enregistre ce navigateur comme poste de confiance (cookie signé).
      tags:
      - postes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Poste'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Poste'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Poste'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poste'
          description: ''
  /api/v1/postes/{id}/revoquer/:
    post:
      operationId: postes_revoquer_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) poste de
          confiance.
        required: true
      tags:
      - postes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poste'
          description: ''
  /api/v1/postes/actuel/:
    get:
      operationId: postes_actuel_retrieve
      description: Ce navigateur est-il un poste de confiance ? (écran de connexion,
        O1).
      tags:
      - postes
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosteActuel'
          description: ''
  /api/v1/sante/:
    get:
      operationId: sante
      description: État du service, utilisé par les contrôles de santé et le bandeau
        hors ligne.
      tags:
      - sante
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
          description: ''
  /api/v1/sauvegardes/:
    get:
      operationId: sauvegardes_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - sauvegardes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSauvegardeList'
          description: ''
  /api/v1/sauvegardes/etat/:
    get:
      operationId: sauvegardes_etat_retrieve
      tags:
      - sauvegardes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtatSauvegardes'
          description: ''
  /api/v1/sauvegardes/lancer/:
    post:
      operationId: sauvegardes_lancer_create
      tags:
      - sauvegardes
      security:
      - cookieAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/users/:
    get:
      operationId: users_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/utilisateurs/:
    get:
      operationId: utilisateurs_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - utilisateurs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompteList'
          description: ''
  /api/v1/utilisateurs/{id}/:
    get:
      operationId: utilisateurs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - utilisateurs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compte'
          description: ''
  /api/v1/utilisateurs/{id}/debloquer/:
    post:
      operationId: utilisateurs_debloquer_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) utilisateur.
        required: true
      tags:
      - utilisateurs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compte'
          description: ''
components:
  schemas:
    Brouillon:
      type: object
      properties:
        cle:
          type: string
          readOnly: true
          title: Écran
        contenu: {}
        mis_a_jour:
          type: string
          format: date-time
          readOnly: true
          title: Mis à jour le
      required:
      - cle
      - contenu
      - mis_a_jour
    CanalEnum:
      enum:
      - sms
      - whatsapp
      type: string
      description: |-
        * `sms` - sms
        * `whatsapp` - whatsapp
    CodeEnvoye:
      type: object
      properties:
        heure:
          type: string
        canal:
          type: string
        telephoneMasque:
          type: string
        renvoiDans:
          type: integer
      required:
      - canal
      - heure
      - renvoiDans
      - telephoneMasque
    CodeTotp:
      type: object
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
    CodesSecours:
      type: object
      properties:
        codesSecours:
          type: array
          items:
            type: string
      required:
      - codesSecours
    Compte:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Name of User
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse électronique
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        bloque:
          type: boolean
          readOnly: true
        bloque_jusqua:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Bloqué jusqu'à
      required:
      - bloque
      - bloque_jusqua
      - email
      - id
      - is_active
      - name
      - profil
    ConnexionCode:
      type: object
      properties:
        utilisateur:
          type: integer
        code:
          type: string
          maxLength: 4
          minLength: 4
      required:
      - code
      - utilisateur
    ConnexionEmail:
      type: object
      properties:
        email:
          type: string
          format: email
        motDePasse:
          type: string
      required:
      - email
      - motDePasse
    EnvoiCode:
      type: object
      properties:
        canal:
          $ref: '#/components/schemas/CanalEnum'
      required:
      - canal
    EtatMfa:
      type: object
      properties:
        totp:
          type: boolean
        codesSecoursRestants:
