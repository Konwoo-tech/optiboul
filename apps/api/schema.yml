components:
  schemas:
    Acces:
      type: object
      properties:
        profil:
          type: string
        espaces:
          type: array
          items:
            type: string
        accueil:
          type: string
          nullable: true
        fonctions:
          type: array
          items:
            type: string
      required:
      - accueil
      - espaces
      - fonctions
      - profil
    Affectations:
      type: object
      properties:
        gerant:
          type: integer
          nullable: true
        production:
          type: integer
          nullable: true
      required:
      - gerant
      - production
    Apercu:
      type: object
      properties:
        groupe:
          type: integer
      required:
      - groupe
    Brouillon:
      type: object
      properties:
        cle:
          type: string
          readOnly: true
          title: Écran
        contenu: {}
        mis_a_jour:
          type: string
          format: date-time
          readOnly: true
          title: Mis à jour le
      required:
      - cle
      - contenu
      - mis_a_jour
    Caisse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        semaine:
          type: integer
        jour:
          type: string
          format: date
          readOnly: true
        creneau:
          type: string
          readOnly: true
          title: Créneau
        caissiere:
          $ref: '#/components/schemas/Caissiere'
        planifiee:
          allOf:
          - $ref: '#/components/schemas/Caissiere'
          nullable: true
        hors_planning:
          type: boolean
          readOnly: true
        fonds:
          type: integer
          readOnly: true
          title: Fonds (FCFA)
        attendu:
          type: integer
          readOnly: true
          nullable: true
          title: Attendu (FCFA)
        compte:
          type: integer
          readOnly: true
          nullable: true
          title: Compté (FCFA)
        ecart:
          type: integer
          readOnly: true
          nullable: true
          title: Écart (FCFA)
        statut:
          type: string
          readOnly: true
        en_cours:
          type: boolean
          readOnly: true
        ouverte_le:
          type: string
          format: date-time
          readOnly: true
        fermee_le:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fermée le
      required:
      - attendu
      - caissiere
      - compte
      - creneau
      - ecart
      - en_cours
      - fermee_le
      - fonds
      - hors_planning
      - id
      - jour
      - ouverte_le
      - planifiee
      - semaine
      - statut
    Caissiere:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
      required:
      - id
      - nom
    CanalEnum:
      enum:
      - sms
      - whatsapp
      type: string
      description: |-
        * `sms` - sms
        * `whatsapp` - whatsapp
    ChangementGroupe:
      type: object
      properties:
        groupe:
          type: integer
      required:
      - groupe
    Client:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 150
        type:
          $ref: '#/components/schemas/TypeEnum'
        telephone:
          type: string
          title: Téléphone
          maxLength: 20
        lieu:
          type: string
          maxLength: 150
        plafond:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Plafond propre (FCFA)
        plafond_effectif:
          type: integer
          readOnly: true
        solde:
          type: integer
          description: 'Somme des mouvements du compte, en FCFA ; négatif : dette
            (R21).'
          readOnly: true
        actif:
          type: boolean
        tarifs:
          type: object
          additionalProperties:
            type: integer
          description: Prix propres au client, produit par produit.
          readOnly: true
        prix:
          type: object
          additionalProperties:
            type: integer
            nullable: true
          description: 'Prix appliqués à la livraison : le tarif du client, sinon
            le prix de base.'
          readOnly: true
      required:
      - id
      - nom
      - plafond_effectif
      - prix
      - solde
      - tarifs
    ClientResume:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
      required:
      - id
      - nom
    Code:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{4}$
      required:
      - code
    CodeEnvoye:
      type: object
      properties:
        heure:
          type: string
        canal:
          type: string
        telephoneMasque:
          type: string
        renvoiDans:
          type: integer
      required:
      - canal
      - heure
      - renvoiDans
      - telephoneMasque
    CodeTotp:
      type: object
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
    CodesSecours:
      type: object
      properties:
        codesSecours:
          type: array
          items:
            type: string
      required:
      - codesSecours
    Commande:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          $ref: '#/components/schemas/ClientResume'
        jour:
          type: string
          format: date
          readOnly: true
          title: Jour de la session
        creneau:
          type: string
          readOnly: true
          title: Créneau
        lignes:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        apres_heure_limite:
          type: boolean
          readOnly: true
          title: Après l'heure limite
        saisie_par:
          type: string
        saisie_le:
          type: string
          format: date-time
          readOnly: true
        modifiee_le:
          type: string
          format: date-time
          readOnly: true
          title: Modifiée le
      required:
      - apres_heure_limite
      - client
      - creneau
      - id
      - jour
      - lignes
      - modifiee_le
      - saisie_le
      - saisie_par
    Compte:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Name of User
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse électronique
        groupe:
          type: integer
          nullable: true
          readOnly: true
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        bloque:
          type: boolean
          readOnly: true
        bloque_jusqua:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Bloqué jusqu'à
      required:
      - bloque
      - bloque_jusqua
      - email
      - groupe
      - id
      - is_active
      - name
      - profil
    CompteCree:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Name of User
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse électronique
        groupe:
          type: integer
          nullable: true
          readOnly: true
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        bloque:
          type: boolean
          readOnly: true
        bloque_jusqua:
