openapi: 3.0.3
info:
  title: OptiBoul API
  version: 1.0.0
  description: API REST d'OptiBoul ERP (Boulangerie du Faubourg)
paths:
  /api/v1/brouillons/:
    get:
      operationId: brouillons_list
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brouillon'
          description: ''
  /api/v1/brouillons/{cle}/:
    get:
      operationId: brouillons_retrieve
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
        '404':
          description: No response body
    put:
      operationId: brouillons_update
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brouillon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Brouillon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Brouillon'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brouillon'
          description: ''
    delete:
      operationId: brouillons_destroy
      parameters:
      - in: path
        name: cle
        schema:
          type: string
          pattern: ^[a-z0-9._-]+$
        required: true
      tags:
      - brouillons
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/caisses/:
    get:
      operationId: caisses_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaisseList'
          description: ''
  /api/v1/caisses/{id}/:
    get:
      operationId: caisses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
  /api/v1/caisses/{id}/especes/:
    get:
      operationId: caisses_especes_retrieve
      description: Fonds, espèces encaissées, dépenses, remises et attendu de la caisse.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especes'
          description: ''
  /api/v1/caisses/{id}/fermer/:
    post:
      operationId: caisses_fermer_create
      description: Un seul comptage ; statut juste, manque ou excédent ; sauvegarde
        (US-042).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fermeture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fermeture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Fermeture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatFermeture'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/{id}/rouvrir/:
    post:
      operationId: caisses_rouvrir_create
      description: Gérant ou propriétaire, motif obligatoire ; le propriétaire est
        informé.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) caisse.
        required: true
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reouverture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reouverture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reouverture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/ouvrir/:
    post:
      operationId: caisses_ouvrir_create
      description: Ouverture en comptant le fonds ; hors planning, le gérant est prévenu.
      tags:
      - caisses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ouverture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ouverture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ouverture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caisse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/caisses/prochaine/:
    get:
      operationId: caisses_prochaine_retrieve
      description: Créneau à ouvrir, caissière planifiée et fonds proposé (20 000
        FCFA).
      tags:
      - caisses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prochaine'
          description: ''
  /api/v1/clients/:
    get:
      operationId: clients_list
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: query
        name: actif
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: recherche
        schema:
          type: string
        description: Premières lettres du nom
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: clients_create
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Client'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/v1/clients/{id}/:
    get:
      operationId: clients_retrieve
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    put:
      operationId: clients_update
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Client'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    patch:
      operationId: clients_partial_update
      description: La caisse lit les clients ; le gérant et le propriétaire les gèrent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClient'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/v1/clients/{id}/tarifs/:
    put:
      operationId: clients_tarifs_update
      description: 'Tarif par produit : un prix fixe le tarif propre, null le retire.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tarifs'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tarifs'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tarifs'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/commandes/:
    get:
      operationId: commandes_list
      description: Commandes d'une session ; la caisse et le gérant les saisissent.
      parameters:
      - in: query
        name: creneau
        schema:
          type: string
          enum:
          - jour
          - nuit
      - in: query
        name: jour
        schema:
          type: string
        description: AAAA-MM-JJ, avec le créneau
      tags:
      - commandes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commande'
          description: ''
    post:
      operationId: commandes_create
      description: Saisit la commande du client ; une seconde saisie remplace ses
        lignes.
      tags:
      - commandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Saisie'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Saisie'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Saisie'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/commandes/{id}/:
    get:
      operationId: commandes_retrieve
      description: Commandes d'une session ; la caisse et le gérant les saisissent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) commande.
        required: true
      tags:
      - commandes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
          description: ''
  /api/v1/commandes/{id}/annuler/:
    post:
      operationId: commandes_annuler_create
      description: Commandes d'une session ; la caisse et le gérant les saisissent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) commande.
        required: true
      tags:
      - commandes
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/commandes/reprendre-veille/:
    post:
      operationId: commandes_reprendre_veille_create
      description: Reprend les commandes du même créneau la veille (O3).
      tags:
      - commandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionVente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionVente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionVente'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reprise'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/commandes/sacs/:
    get:
      operationId: commandes_sacs_retrieve
      description: Pains commandés et sacs à pétrir par produit (CdC §5.3).
      parameters:
      - in: query
        name: creneau
        schema:
          type: string
          enum:
          - jour
          - nuit
      - in: query
        name: jour
        schema:
          type: string
        description: AAAA-MM-JJ, avec le créneau
      tags:
      - commandes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sacs'
          description: ''
  /api/v1/connexion/annuler/:
    post:
      operationId: connexion_annuler_create
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/connexion/changer-utilisateur/:
    post:
      operationId: connexion_changer_utilisateur_create
      description: '« Changer d''utilisateur » : la session se ferme ; poste et brouillons
        restent.'
      tags:
      - connexion
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/connexion/code/:
    post:
      operationId: connexion_code_create
      description: Nom + code à 4 chiffres, vérifié dès le 4ᵉ chiffre (US-010).
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatConnexion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/deconnexion/:
    post:
      operationId: connexion_deconnexion_create
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/connexion/email/:
    post:
      operationId: connexion_email_create
      description: 'E-mail + mot de passe : double authentification à chaque connexion.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionEmail'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatConnexion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/invitation/:
    post:
      operationId: connexion_invitation_create
      description: 'Lien de l''invitation (US-020) : la personne choisit son mot de
        passe.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invitation'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/otp/envoyer/:
    post:
      operationId: connexion_otp_envoyer_create
      description: Code à 6 chiffres par SMS ou WhatsApp (renvoi après 30 s, bascule
        de canal).
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvoiCode'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeEnvoye'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/otp/verifier/:
    post:
      operationId: connexion_otp_verifier_create
      description: Code reçu, vérifié dès le 6ᵉ chiffre ; 3 essais puis nouveau code.
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verification'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/session/:
    get:
      operationId: connexion_session_retrieve
      description: Méthode de connexion et délai d'inactivité, pour le minuteur de
        l'écran.
      tags:
      - connexion
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/connexion/totp/:
    post:
      operationId: connexion_totp_create
      description: 'Sans réseau : code de l''application d''authentification ou code
        de secours.'
      tags:
      - connexion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verification'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/connexion/utilisateurs/:
    get:
      operationId: connexion_utilisateurs_list
      description: Les noms à toucher sur le poste de confiance du comptoir (O1).
      tags:
      - connexion
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonneDuPoste'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleme'
          description: ''
  /api/v1/demandes/:
    get:
      operationId: demandes_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - accordee
          - en_attente
          - refusee
      - in: query
        name: type
        schema:
          type: string
      tags:
      - demandes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDemandeList'
          description: ''
    post:
      operationId: demandes_create
      description: Émet une demande liée à l'objet bloqué ; les valideurs sont prévenus.
