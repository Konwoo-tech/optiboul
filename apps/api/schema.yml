components:
  schemas:
    AbsencesProposees:
      type: object
      properties:
        ligne:
          type: integer
        employe:
          type: string
        jours:
          type: array
          items:
            type: string
            format: date
        saisies:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          description: Jours d'absence déjà portés sur la ligne.
      required:
      - employe
      - jours
      - ligne
      - saisies
    Acces:
      type: object
      properties:
        profil:
          type: string
        espaces:
          type: array
          items:
            type: string
        accueil:
          type: string
          nullable: true
        fonctions:
          type: array
          items:
            type: string
      required:
      - accueil
      - espaces
      - fonctions
      - profil
    Accord:
      type: object
      properties:
        code_gerant:
          $ref: '#/components/schemas/CodeGerant'
    Accueil:
      type: object
      properties:
        profil:
          type: string
        ecran:
          $ref: '#/components/schemas/EcranEnum'
        contenu:
          type: object
          additionalProperties: {}
          description: Ce que l'écran d'arrivée affiche.
      required:
      - contenu
      - ecran
      - profil
    AchatCourantEnum:
      enum:
      - bois
      - levure
      - glace
      - sel
      - huile
      type: string
      description: |-
        * `bois` - bois
        * `levure` - levure
        * `glace` - glace
        * `sel` - sel
        * `huile` - huile
    Affectable:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
      required:
      - id
      - nom
    Affectations:
      type: object
      properties:
        gerant:
          type: integer
          nullable: true
        production:
          type: integer
          nullable: true
      required:
      - gerant
      - production
    Alerte:
      type: object
      properties:
        type:
          type: string
        niveau:
          $ref: '#/components/schemas/AlerteNiveauEnum'
        titre:
          type: string
        detail:
          type: string
        nombre:
          type: integer
        lien:
          type: string
          description: Écran du détail à ouvrir.
      required:
      - detail
      - lien
      - niveau
      - nombre
      - titre
      - type
    AlerteNiveauEnum:
      enum:
      - bloquant
      - surveiller
      type: string
      description: |-
        * `bloquant` - bloquant
        * `surveiller` - surveiller
    Annulation:
      type: object
      properties:
        motif:
          type: string
          maxLength: 255
      required:
      - motif
    Apercu:
      type: object
      properties:
        groupe:
          type: integer
      required:
      - groupe
    BilanSemaine:
      type: object
      properties:
        recette:
          type: integer
          description: Encaissements de la semaine, tous modes (FCFA).
        depenses:
          allOf:
          - $ref: '#/components/schemas/DepensesDeLaSemaine'
          description: Dépenses validées.
        productions:
          $ref: '#/components/schemas/ProductionsDeLaSemaine'
        ecart_caisse_cumule:
          type: integer
          description: Somme des écarts des caisses fermées (FCFA).
        caisses:
          type: integer
          description: Caisses ouvertes dans la semaine.
        receptions:
          type: integer
          description: Réceptions fournisseurs.
      required:
      - caisses
      - depenses
      - ecart_caisse_cumule
      - productions
      - receptions
      - recette
    BlankEnum:
      enum:
      - ''
    Brouillon:
      type: object
      properties:
        cle:
          type: string
          readOnly: true
          title: Écran
        contenu: {}
        mis_a_jour:
          type: string
          format: date-time
          readOnly: true
          title: Mis à jour le
      required:
      - cle
      - contenu
      - mis_a_jour
    Budget:
      type: object
      properties:
        mois:
          type: string
          description: AAAA-MM
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneBudget'
        budget:
          type: integer
        depense:
          type: integer
      required:
      - budget
      - depense
      - lignes
      - mois
    BudgetCategorie:
