          type: integer
        jour:
          type: string
          format: date
          readOnly: true
        creneau:
          type: string
          readOnly: true
          title: Créneau
        caissiere:
          $ref: '#/components/schemas/Caissiere'
        planifiee:
          allOf:
          - $ref: '#/components/schemas/Caissiere'
          nullable: true
        hors_planning:
          type: boolean
          readOnly: true
        fonds:
          type: integer
          readOnly: true
          title: Fonds (FCFA)
        attendu:
          type: integer
          readOnly: true
          nullable: true
          title: Attendu (FCFA)
        compte:
          type: integer
          readOnly: true
          nullable: true
          title: Compté (FCFA)
        ecart:
          type: integer
          readOnly: true
          nullable: true
          title: Écart (FCFA)
        statut:
          type: string
          readOnly: true
        en_cours:
          type: boolean
          readOnly: true
        ouverte_le:
          type: string
          format: date-time
          readOnly: true
        fermee_le:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fermée le
        ouverte_par:
          allOf:
          - $ref: '#/components/schemas/Caissiere'
          description: 'La personne connectée qui a ouvert : c''est toujours la caissière.'
        fermee_par:
          allOf:
          - $ref: '#/components/schemas/Caissiere'
          nullable: true
          description: Dernière fermeture ; null tant que la caisse est ouverte (#312).
        recette:
          type: integer
          description: Encaissements de la caisse, tous modes, en FCFA (comme le récapitulatif).
          readOnly: true
      required:
      - attendu
      - caissiere
      - compte
      - creneau
      - ecart
      - en_cours
      - fermee_le
      - fermee_par
      - fonds
      - hors_planning
      - id
      - jour
      - ouverte_le
      - ouverte_par
      - planifiee
      - recette
      - semaine
      - statut
