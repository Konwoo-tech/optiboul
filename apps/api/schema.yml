        limite court.
      properties:
        jour:
          type: string
          format: date
        creneau:
          $ref: '#/components/schemas/CreneauEnum'
    Seuil:
      type: object
      properties:
        seuil:
          type: integer
          description: À partir de ce montant en FCFA, hors pré-autorisation (R8).
      required:
      - seuil
    StatutEnvoiEnum:
      enum:
      - en_attente
      - envoye
      - echec
      type: string
      description: |-
        * `en_attente` - en_attente
        * `envoye` - envoye
        * `echec` - echec
    Stock:
      type: object
      properties:
        quantites:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          description: Code de la matière → stock, dans l'unité de la matière.
      required:
      - quantites
    Supplement:
      type: object
      properties:
        id:
          type: integer
        statut:
          type: string
          description: auto_accorde (O17), demande, accorde ou refuse.
        sacs:
          type: object
          additionalProperties:
            type: integer
        motif:
          type: string
        farine_necessaire:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        farine_en_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        demande:
          type: string
          description: DEM-xxx au-delà du seuil.
      required:
      - demande
      - farine_en_stock
      - farine_necessaire
      - id
      - motif
      - sacs
      - statut
    TableauDeBord:
      type: object
      properties:
        mois:
          type: string
        indicateurs:
          $ref: '#/components/schemas/Indicateurs'
        graphiques:
          $ref: '#/components/schemas/Graphiques'
      required:
      - graphiques
      - indicateurs
      - mois
    Tarifs:
      type: object
      properties:
        tarifs:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            nullable: true
          description: Code du produit → prix en FCFA ; null retire le tarif propre.
      required:
      - tarifs
    ThemeEnum:
      enum:
      - auto
      - clair
      - sombre
      type: string
      description: |-
        * `auto` - Automatique (sombre la nuit)
        * `clair` - Clair
        * `sombre` - Sombre
    TotalCompare:
      type: object
      properties:
        avant:
          type: integer
          description: Dans la copie restaurée.
        apres:
          type: integer
          description: Dans la base après restauration.
      required:
      - apres
      - avant
    Totaux:
      type: object
      properties:
        ration:
          type: object
          additionalProperties:
            type: integer
          title: Livres
        caisse:
          type: integer
      required:
      - caisse
      - ration
    TotauxRapprochement:
      type: object
      properties:
        ventes:
          type: integer
        recette:
          type: integer
      required:
      - recette
      - ventes
    TypeEnum:
      enum:
      - livreur
      - restaurant
      - hotel
      - particulier
      type: string
      description: |-
        * `livreur` - livreur
        * `restaurant` - restaurant
        * `hotel` - hotel
        * `particulier` - particulier
    UniteEnum:
      enum:
      - kg
      - g
      - l
      - sachet
      - unite
      type: string
      description: |-
        * `kg` - kg
        * `g` - g
        * `l` - l
        * `sachet` - sachet
        * `unite` - unite
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Name of User
          maxLength: 255
        email:
          type: string
          format: email
          readOnly: true
          title: Adresse électronique
        url:
          type: string
          format: uri
          readOnly: true
        profil:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ProfilEnum'
          - $ref: '#/components/schemas/NullEnum'
        theme:
          allOf:
          - $ref: '#/components/schemas/ThemeEnum'
          title: Thème
        langue:
          $ref: '#/components/schemas/LangueEnum'
      required:
      - email
      - id
      - profil
      - url
    Valeur:
      type: object
      properties:
        valeur: {}
        auteur:
          type: string
        le:
          type: string
          format: date-time
      required:
      - auteur
      - le
      - valeur
    ValideurPossible:
      type: object
      properties:
        profil:
          type: string
        nom:
          type: string
      required:
      - nom
      - profil
    Verification:
      type: object
      properties:
        code:
          type: string
          maxLength: 12
      required:
      - code
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
