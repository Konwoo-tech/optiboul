[project]
name = "optiboul"
version = "0.1.0"
description = "OptiBoul ERP - Boulangerie du Faubourg (Etoudi, Yaoundé)"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Dongmo Noukouankouang Baudouin", email = "dongmobaudouin@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.6.3",
  "crispy-bootstrap5==2026.9",
  "django==6.0.9",
  "django-allauth[mfa]==65.19.7",
  "django-anymail[mailgun]==15.2",
  "django-celery-beat==2.9.0",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "django-storages[s3]==1.14.6",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "flower==2.2.0",
  "gunicorn==26.2.0",
  "hiredis==3.4.2",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "psycopg[c]==3.3.6",
  "python-slugify==9.1.3",
  "redis==8.1.0",
  "weasyprint==70.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.2",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-upgrade==1.33.0",
  "djangorestframework-stubs==3.18.1",
  "djlint==1.46.4",
  "factory-boy==3.3.3",
  "hypothesis==6.170.5",
  "import-linter==2.15",
  "ipdb==0.13.13",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "psycopg[c]==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.17.0",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.3.0",
  "werkzeug[watchdog]==3.1.9",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
ignore = "H006,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.per-file-ignores."**/tests/**" = [
  "PLR2004", # valeurs métier explicites dans les tests (FCFA)
  "PLR0913", # les tests reçoivent leurs fixtures en arguments
  "PLR0917",
  "EM101",   # refus métier d'essai : un code, puis le message
]
# RefusConnexion reçoit un code de refus du catalogue REFUS, pas un message.
lint.per-file-ignores."optiboul/users/connexion.py" = [ "EM101" ]
lint.per-file-ignores."optiboul/users/double_auth.py" = [ "EM101" ]
# RefusMetier reçoit d'abord un code stable (semaine_cloturee…), puis le message.
lint.per-file-ignores."optiboul/*/application/*.py" = [ "EM101" ]
lint.per-file-ignores."optiboul/*/domain/*.py" = [ "EM101" ]
lint.per-file-ignores."optiboul/*/infrastructure/*.py" = [ "EM101" ]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true }
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "optiboul/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

# ==== import-linter : règle de dépendance de la Clean Architecture ====
# domain <- application <- infrastructure / api (spécification technique §4.1)
[tool.importlinter]
root_package = "optiboul"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Couches de chaque application de domaine"
type = "layers"
layers = [ "api", "infrastructure", "application", "domain" ]
containers = [
  "optiboul.core",
  "optiboul.caisse",
  "optiboul.ventes",
  "optiboul.clients",
  "optiboul.production",
  "optiboul.stocks",
  "optiboul.achats",
  "optiboul.depenses",
  "optiboul.demandes",
  "optiboul.paie",
  "optiboul.rapports",
  "optiboul.notifications",
]

[[tool.importlinter.contracts]]
name = "Le domaine reste en Python pur"
type = "forbidden"
source_modules = [ "optiboul.*.domain" ]
forbidden_modules = [ "django", "rest_framework", "celery" ]
