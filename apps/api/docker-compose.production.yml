volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}

  production_redis_data: {}
  production_sauvegardes: {}



services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: optiboul_production_django
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: optiboul_production_postgres
    restart: always
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: optiboul_production_traefik
    restart: always
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
      - ./compose/production/traefik/certs:/etc/traefik/certs:ro
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      # Flower (administration Celery) : accessible depuis le serveur seulement (ADR-19).
      - '127.0.0.1:5555:5555'

  redis:
    image: docker.io/redis:7.2
    restart: always

    volumes:
      - production_redis_data:/data


  celeryworker:
    <<: *django
    image: optiboul_production_celeryworker
    command: /start-celeryworker
    # Copies locales de la base (US-142) : à doubler sur le disque externe (CdC §10.1).
    environment:
      - OPTIBOUL_DOSSIER_SAUVEGARDES=/sauvegardes
    volumes:
      - production_sauvegardes:/sauvegardes

  celerybeat:
    <<: *django
    image: optiboul_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: optiboul_production_flower
    command: /start-flower

  awscli:
    build:
      context: .
      dockerfile: ./compose/production/aws/Dockerfile
    env_file:
      - ./.envs/.production/.django
    volumes:
      - production_postgres_data_backups:/backups:z
