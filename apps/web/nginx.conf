# Application web unique : toutes les routes (/connexion, /comptoir, /atelier, /gestion…) sont gérées par React.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Compression : le JS et le CSS de l'application passent de plusieurs centaines de Ko à
  # quelques dizaines (le comptoir peut être servi sur un réseau local lent).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

  # Fichiers fingerprintés par Vite : cache long. Un seul en-tête Cache-Control
  # (`expires` en ajouterait un second).
  location /assets/ {
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html jamais mis en cache : une mise à jour est visible au rechargement.
  location / {
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
