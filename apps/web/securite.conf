# En-têtes de sécurité de l'application web. Inclus dans chaque `location` : nginx n'hérite
# pas des `add_header` du serveur dès qu'une `location` en déclare un.
#
# Traefik pose déjà nosniff, Referrer-Policy, le refus d'iframe et HSTS (traefik.yml,
# middleware « securite ») : ils ne sont pas répétés ici pour éviter les doublons.
#
# CSP : tout vient de la même origine. `style-src 'unsafe-inline'` est nécessaire à Mantine
# (variables CSS du thème injectées par MantineProvider et attributs `style` de React).
# `form-action 'self'` couvre la connexion et la déconnexion django-allauth (même origine).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
