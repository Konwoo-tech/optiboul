# En-têtes de sécurité de l'application web. Inclus dans chaque `location` : nginx n'hérite
# pas des `add_header` du serveur dès qu'une `location` en déclare un.
#
# Traefik pose déjà nosniff, Referrer-Policy, le refus d'iframe et, sur l'entrée TLS, HSTS
# (traefik.yml, middleware « securite ») : ils ne sont pas répétés ici pour éviter les doublons.
# Sur l'entrée distante (HTTP derrière le tunnel), HSTS doit être posé par le tunnel.
#
# Connexion Google (#306) : le bouton officiel de Google Identity Services charge son script, ses
# styles et un cadre depuis accounts.google.com/gsi/ ; rien d'autre n'est ouvert à Google. Le jeton
# d'identité est envoyé à l'API (même origine) : le navigateur ne contacte pas d'autre serveur.
#
# CSP : tout vient de la même origine. `style-src 'unsafe-inline'` est nécessaire à Mantine
# (variables CSS du thème injectées par MantineProvider et attributs `style` de React).
# `form-action 'self'` couvre la connexion et la déconnexion django-allauth (même origine).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
