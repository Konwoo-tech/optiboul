packages:
  - apps/frontend/*
  - apps/mobile/*
  - packages/*
  - e2e

# Scripts d'installation autorisés (pnpm les bloque par défaut).
allowBuilds:
  esbuild: true

# Versions partagées par toutes les applications web et les paquets (« catalog: »).
# React est aligné sur la version imposée par le SDK Expo de l'application mobile.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^24.19.2
  typescript: ~7.0.2
  vite: ^8.3.4
  '@vitejs/plugin-react': ^6.1.2
  vitest: ^5.0.5
  jsdom: ^30.1.3
  oxlint: ^1.88.0
  '@testing-library/react': ^16.3.3
  msw: ^3.0.3
  '@tanstack/react-query': ^5.104.5
  react-router: ^8.5.0
  '@mantine/core': ^9.7.3
  '@mantine/hooks': ^9.7.3
  '@fontsource-variable/manrope': ^5.3.0
  i18next: ^26.5.3
  react-i18next: ^17.1.0
  zod: ^4.6.7
  react-hook-form: ^7.90.0

# Paquets plus récents que l'âge minimal de publication exigé par pnpm, acceptés explicitement.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - '@tanstack/query-core@5.104.5'
  - '@tanstack/react-query@5.104.5'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16
  - i18next@26.5.3
  - react-router@8.5.0
  - expo-router@58.0.24
