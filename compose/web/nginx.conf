# Application web unique : toutes les routes (/connexion, /comptoir, /atelier, /gestion…) sont gérées par React.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Fichiers fingerprintés par Vite : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html jamais mis en cache : une mise à jour est visible au rechargement.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
