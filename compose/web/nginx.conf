# Une origine, un préfixe par application ; chaque application gère ses routes (fallback SPA).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Fichiers fingerprintés par Vite : cache long.
  location ~ ^/(comptoir/|atelier/|gestion/)?assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /comptoir/ { try_files $uri $uri/ /comptoir/index.html; }
  location /atelier/  { try_files $uri $uri/ /atelier/index.html; }
  location /gestion/  { try_files $uri $uri/ /gestion/index.html; }
  location /          { try_files $uri $uri/ /index.html; }

  # index.html jamais mis en cache : une mise à jour est visible au rechargement.
  location ~ /index\.html$ { add_header Cache-Control "no-cache"; }
}
