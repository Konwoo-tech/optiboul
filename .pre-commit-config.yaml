# Monorepo : les hooks Python ne visent que apps/api/ ; le web est contrôlé par oxlint / Prettier (apps/web).
exclude: '^(docs|apps/api/docs)/|/migrations/|devcontainer.json|^apps/web/src/api/generated/|^apps/web/pnpm-lock.yaml$'
default_stages: [pre-commit]
minimum_pre_commit_version: '3.2.0'

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.33.0'
    hooks:
      - id: django-upgrade
        files: ^apps/api/
        args: ['--target-version', '6.0']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Linter
      - id: ruff-check
        files: ^apps/api/
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt
        files: ^apps/api/pyproject\.toml$

  - repo: https://github.com/djlint/djLint
    rev: v1.46.4
    hooks:
      - id: djlint-reformat-django
        files: ^apps/api/.*\.html$
      - id: djlint-django
        files: ^apps/api/.*\.html$

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
